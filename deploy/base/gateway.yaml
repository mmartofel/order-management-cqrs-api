# order-management: the API's one origin (docs/DEPLOY-CONVENTION.md: the UI proxies /api/ and /actuator/{health,info} to
# http://order-management:8080). Routes reads to query-service and writes to order-management by HTTP method, reference
# data to reference-service; no database, no Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-management
  labels:
    app: order-management
    app.kubernetes.io/name: order-management
    app.kubernetes.io/part-of: order-management
data:
  SERVER_PORT: "8080"
  COMMAND_SERVICE_URL: "http://order-management:8080"
  QUERY_SERVICE_URL: "http://query-service:8081"
  REFERENCE_SERVICE_URL: "http://reference-service:8082"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management
  labels:
    app: order-management
    app.kubernetes.io/name: order-management
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-management
  template:
    metadata:
      labels:
        app: order-management
        app.kubernetes.io/name: order-management
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: order-management
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: order-management
          image: order-management-order-management      # bare name; Skaffold sets the registry and tag
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-management
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:                      # let the Service stop routing before graceful shutdown starts
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: order-management
  labels:
    app: order-management
    app.kubernetes.io/name: order-management
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-management
spec:
  selector:
    app: order-management
  ports:
    - name: http
      port: 8080
      targetPort: http
