# Example of an environment overlay. Copy this folder to deploy/environments/<env>/ (git-ignored) and adjust:
#   DEPLOY_OVERLAY=deploy/environments/<env> skaffold run -p openshift --default-repo=<registry> -n <namespace>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../overlays/openshift
patches:
  # two replicas of the read side
  - target: { kind: Deployment, name: query-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # bigger volumes for the event store and Kafka
  - target: { kind: PersistentVolumeClaim, name: postgres-command }
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target: { kind: PersistentVolumeClaim, name: kafka }
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
