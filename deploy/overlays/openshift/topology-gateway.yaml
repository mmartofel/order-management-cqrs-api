# Developer > Topology: Spring icon, arrows to the services behind the gateway, source link.
# Deployment metadata only: selectors are immutable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management
  labels:
    app.openshift.io/runtime: spring
  annotations:
    app.openshift.io/connects-to: >-
      [{"apiVersion":"apps/v1","kind":"Deployment","name":"command-service"},
      {"apiVersion":"apps/v1","kind":"Deployment","name":"query-service"},
      {"apiVersion":"apps/v1","kind":"Deployment","name":"reference-service"}]
    app.openshift.io/vcs-uri: https://github.com/mmartofel/order-management-cqrs-api
