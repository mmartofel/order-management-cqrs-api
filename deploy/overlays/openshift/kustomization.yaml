# OpenShift, any cluster and namespace: the base, a Route for the gateway (host generated by OpenShift) and the
# Topology view's icons, arrows and source links.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - routes.yaml
patches:
  - path: topology-gateway.yaml
  - path: topology-keycloak.yaml
  - path: topology-command-service.yaml
  - path: topology-query-service.yaml
  - path: topology-reference-service.yaml
  - path: topology-postgres-command.yaml
  - path: topology-postgres-query.yaml
  - path: topology-postgres-reference.yaml
  - path: topology-kafka.yaml
