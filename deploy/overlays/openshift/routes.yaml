# Routes without spec.host: OpenShift generates <name>-<namespace>.<apps domain>. Edge TLS, HTTP redirected to HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: command-service
  labels:
    app: command-service
    app.kubernetes.io/name: command-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-management
spec:
  to:
    kind: Service
    name: command-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
