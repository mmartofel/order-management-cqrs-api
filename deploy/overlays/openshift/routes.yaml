# One Route, for the gateway: machine clients, smoke tests and the contract at /v3/api-docs. The UI's own Route is its public host and
# proxies /api/ here inside the cluster; command-service, query-service and reference-service have no Route.
# No spec.host: OpenShift generates <name>-<namespace>.<apps domain>. Edge TLS, HTTP redirected to HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: order-management
  labels:
    app: order-management
    app.kubernetes.io/name: order-management
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-management
spec:
  to:
    kind: Service
    name: order-management
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
