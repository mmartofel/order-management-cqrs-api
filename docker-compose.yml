# Local dependencies of the three services: one PostgreSQL per service and Kafka.
#   docker compose up -d --wait      (or: podman compose up -d --wait)
services:
  command-db:
    image: postgres:18
    environment:
      POSTGRES_DB: orders_command
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orders", "-d", "orders_command"]
      interval: 5s
      start_period: 10s
    volumes:
      - command-db:/var/lib/postgresql

  query-db:
    image: postgres:18
    environment:
      POSTGRES_DB: orders_query
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orders", "-d", "orders_query"]
      interval: 5s
      start_period: 10s
    volumes:
      - query-db:/var/lib/postgresql

  reference-db:
    image: postgres:18
    environment:
      POSTGRES_DB: orders_reference
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orders", "-d", "orders_reference"]
      interval: 5s
      start_period: 10s
    volumes:
      - reference-db:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      start_period: 20s
    volumes:
      - kafka:/var/lib/kafka/data

volumes:
  command-db:
  query-db:
  reference-db:
  kafka:
