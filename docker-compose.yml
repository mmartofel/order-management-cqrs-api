# Local dependencies of the services: one PostgreSQL per service, Kafka and Keycloak (realm "orders" from
# deploy/base/realm.json).
#   docker compose up -d --wait      (or: podman compose up -d --wait)
services:
  command-db:
    image: postgres:18
    environment:
      POSTGRES_DB: orders_command
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orders", "-d", "orders_command"]
      interval: 5s
      start_period: 10s
    volumes:
      - command-db:/var/lib/postgresql

  query-db:
    image: postgres:18
    environment:
      POSTGRES_DB: orders_query
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orders", "-d", "orders_query"]
      interval: 5s
      start_period: 10s
    volumes:
      - query-db:/var/lib/postgresql

  reference-db:
    image: postgres:18
    environment:
      POSTGRES_DB: orders_reference
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orders", "-d", "orders_reference"]
      interval: 5s
      start_period: 10s
    volumes:
      - reference-db:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      start_period: 20s
    volumes:
      - kafka:/var/lib/kafka/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Fixed demo values for local development only; in a cluster they come from Secrets (deploy/ensure-secrets.sh).
      ORDERS_API_CLIENT_SECRET: orders-api-secret
      DEMO_VIEWER_PASSWORD: viewer
      DEMO_EDITOR_PASSWORD: editor
    volumes:
      - ./deploy/base/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # The image has no curl: ask /health/ready on the management port through /dev/tcp (sh is bash).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      start_period: 60s

volumes:
  command-db:
  query-db:
  reference-db:
  kafka:
