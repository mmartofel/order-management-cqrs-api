name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AXONIQ_UPDATE_CHECKER_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # a broken patch fails the build, not the deploy
      - name: Render deployment manifests
        run: |
          for dir in deploy/overlays/* deploy/environments/example; do
            echo "== $dir"; kubectl kustomize "$dir" > /dev/null
          done

      # Testcontainers starts PostgreSQL and Kafka on the runner's Docker
      - name: Build and test
        run: ./mvnw -B clean verify

      # the services' tests export their contracts and the gateway's test merges them; a change to the API without
      # the regenerated contract/openapi.json fails here
      - name: Contract is up to date
        run: |
          git diff --exit-code -- contract/ || {
            echo "contract/openapi.json is out of date: run ./mvnw clean verify and commit it"; exit 1; }
          test -z "$(git status --porcelain contract/)"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "*/target/surefire-reports"
